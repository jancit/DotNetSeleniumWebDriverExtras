name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      id-token: write   # required for NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack SeleniumExtras.WaitHelpers
        run: dotnet pack src/WaitHelpers/SeleniumExtras.WaitHelpers.csproj -c Release -o ./nupkg

      - name: Pack SeleniumExtras.PageObjects
        run: dotnet pack src/PageObjects/SeleniumExtras.PageObjects.csproj -c Release -o ./nupkg

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ivan.tsitovich

      - name: Push packages
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
